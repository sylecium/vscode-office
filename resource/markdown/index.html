<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <!-- The page displays untrusted documents: no inline event handler, script URL, frame or form. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src {{cspSource}} 'nonce-{{nonce}}'; style-src {{cspSource}} https: 'unsafe-inline'; img-src {{cspSource}} https: http: data: blob:; media-src {{cspSource}} https: http: data: blob:; font-src {{cspSource}} https: data:; connect-src {{cspSource}} data: blob:; frame-src 'none'; form-action 'none'; base-uri {{cspSource}}">
    <title>Markdown Editor</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel="stylesheet" href="dist/index.css" />
    <link rel="stylesheet" href="index.css" />
    <link rel="preload" as="script" href="dist/index.min.js" />
    <link rel="preload" as="script" href="dist/js/lute/lute.min.js" />
    <base href="{{baseUrl}}/">
</head>

<body>
    <div id="vditor"></div>

    <div id="instant-preview" data-cache-id="{{documentCacheId}}" aria-hidden="true" hidden>
        <div class="vditor-toolbar"></div>
        <div class="vditor-content">
            <div class="instant-preview__outline"></div>
            <div class="instant-preview__editor">
                <pre class="vditor-reset"><span class="vditor-editor-boundary"></span><!--instant-preview--></pre>
            </div>
        </div>
    </div>
    <script nonce="{{nonce}}">
        // Paints the document with the editor's last theme and geometry, while the editor loads underneath.
        (() => {
            const preview = document.getElementById('instant-preview');
            let shell;
            try { shell = JSON.parse(localStorage.getItem('office-preview-shell')); } catch { }
            // Nothing to match yet, or the document reopens further down: better blank than a jump.
            if (!shell || Number(localStorage.getItem(preview.dataset.cacheId + '-scroll')) > 0) {
                preview.remove();
                return;
            }
            document.documentElement.dataset.editorTheme = preview.dataset.editorTheme = shell.theme;
            preview.dataset.pageWidthMode = shell.pageWidthMode;
            preview.className = shell.className;
            if (shell.theme === 'Auto') {
                preview.classList.toggle('vditor--dark', document.body.matches('.vscode-dark, .vscode-high-contrast:not(.vscode-high-contrast-light)'));
            }
            preview.style.cssText = shell.style;
            preview.querySelector('.vditor-toolbar').style.height = shell.top + 'px';
            preview.querySelector('.instant-preview__outline').style.width = shell.left + 'px';
            preview.querySelector('.instant-preview__editor').classList.add('vditor-' + shell.mode);
            preview.querySelector('.vditor-reset').style.padding = shell.padding;
            preview.hidden = false;
        })();
    </script>

    <!-- Context Menu -->
    <div class="vditor-context-menu" id="context-menu" role="menu" hidden>
        <div class="vditor-context-menu__group" role="group">
            <button class="vditor-context-menu__item" type="button" data-action="aiPolish" role="menuitem">
                <span class="vditor-context-menu__icon" aria-hidden="true">
                    <span class="codicon codicon-sparkle"></span>
                </span>
                <span class="vditor-context-menu__label">AI Polish</span>
            </button>
        </div>
        <div class="vditor-context-menu__separator" role="separator"></div>
        <div class="vditor-context-menu__group" role="group">
            <button class="vditor-context-menu__item" type="button" data-action="copy" role="menuitem">
                <span class="vditor-context-menu__icon" aria-hidden="true">
                    <span class="codicon codicon-copy"></span>
                </span>
                <span class="vditor-context-menu__label">Copy</span>
            </button>
            <button class="vditor-context-menu__item" type="button" data-action="copyAsHtml" role="menuitem">
                <span class="vditor-context-menu__icon" aria-hidden="true">
                    <span class="codicon codicon-code"></span>
                </span>
                <span class="vditor-context-menu__label">Copy as HTML</span>
            </button>
            <button class="vditor-context-menu__item" type="button" data-action="copyAsPlainText" role="menuitem">
                <span class="vditor-context-menu__icon" aria-hidden="true">
                    <span class="codicon codicon-symbol-string"></span>
                </span>
                <span class="vditor-context-menu__label">Copy as Plain Text</span>
            </button>
            <button class="vditor-context-menu__item" type="button" data-action="paste" role="menuitem">
                <span class="vditor-context-menu__icon" aria-hidden="true">
                    <span class="codicon codicon-clippy"></span>
                </span>
                <span class="vditor-context-menu__label">Paste</span>
            </button>
            <button class="vditor-context-menu__item" type="button" data-action="insertImage" role="menuitem">
                <span class="vditor-context-menu__icon" aria-hidden="true">
                    <span class="codicon codicon-file-media"></span>
                </span>
                <span class="vditor-context-menu__label">Insert Image</span>
            </button>
        </div>
        <div class="vditor-context-menu__separator" role="separator"></div>
        <div class="vditor-context-menu__group" role="group">
            <button class="vditor-context-menu__item vditor-context-menu__item--desktop-only" type="button"
                data-action="exportPdf" role="menuitem">
                <span class="vditor-context-menu__icon" aria-hidden="true">
                    <span class="codicon codicon-file-pdf"></span>
                </span>
                <span class="vditor-context-menu__label">Export PDF</span>
            </button>
            <button class="vditor-context-menu__item vditor-context-menu__item--desktop-only" type="button"
                data-action="exportPdfWithoutOutline" role="menuitem">
                <span class="vditor-context-menu__icon" aria-hidden="true">
                    <span class="codicon codicon-file-pdf"></span>
                </span>
                <span class="vditor-context-menu__label">Export PDF (Without Outline)</span>
            </button>
            <button class="vditor-context-menu__item vditor-context-menu__item--desktop-only" type="button"
                data-action="exportDocx" role="menuitem">
                <span class="vditor-context-menu__icon" aria-hidden="true">
                    <span class="codicon codicon-file-text"></span>
                </span>
                <span class="vditor-context-menu__label">Export Docx</span>
            </button>
            <button class="vditor-context-menu__item vditor-context-menu__item--desktop-only" type="button"
                data-action="exportHtml" role="menuitem">
                <span class="vditor-context-menu__icon" aria-hidden="true">
                    <span class="codicon codicon-code"></span>
                </span>
                <span class="vditor-context-menu__label">Export HTML</span>
            </button>
        </div>
        <div class="vditor-context-menu__separator" role="separator"></div>
        <div class="vditor-context-menu__group" role="group">
            <button class="vditor-context-menu__item vditor-context-menu__item--desktop-only" type="button"
                data-action="showInFolder" role="menuitem">
                <span class="vditor-context-menu__icon" aria-hidden="true">
                    <span class="codicon codicon-folder-opened"></span>
                </span>
                <span class="vditor-context-menu__label">Show in Folder</span>
            </button>
        </div>
    </div>

</body>
<template id="editor-scripts">
    <script src="dist/index.min.js"></script>
    <!-- Fetched with the editor instead of after it. Vditor skips its own load when this id exists. -->
    <script id="vditorLuteScript" src="dist/js/lute/lute.min.js"></script>
    <script src="../lib/vscode.js"></script>
    <script src="index.js" type="module"></script>
</template>
<script nonce="{{nonce}}">
    // Running the editor scripts blocks painting for ~100 ms: let the preview reach the screen first.
    (() => {
        let started = false;
        const start = () => {
            if (started) return;
            started = true;
            for (const source of document.getElementById('editor-scripts').content.querySelectorAll('script')) {
                const script = document.createElement('script');
                for (const { name, value } of source.attributes) script.setAttribute(name, value);
                script.async = false; // keeps the execution order
                document.body.appendChild(script);
            }
        };
        if (!document.getElementById('instant-preview')) return start();
        // VS Code keeps the page invisible until it has loaded.
        addEventListener('load', () => requestAnimationFrame(() => setTimeout(start)));
        setTimeout(start, 300); // no animation frame in a hidden tab
    })();
</script>

</html>
