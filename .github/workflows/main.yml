name: CI
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20.x
    - run: npm ci
    - run: npx eslint "src/**/*.{ts,tsx}"
    - run: npm test
    - run: |
        echo ">>> Start compile vscode-office."
        npm run build
        echo ">>> Compile vscode-office sucess!"